    <script>
      let carrinho = [];
      let totalGeral = 0;
      widow.listaProdutos =[];

      widow.onload = () =>{
        fetch('/listar-clientes').then(res=>json()).then(data =>{
          const selC = document.getElementByld('selCliente');
          data.forEach(c=> selC.innerHTML += `<option value="${c.id}">{c.nome}</option>`);
        });
      };
      
      
    </script>
